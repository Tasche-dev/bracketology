yaml
name: Refresh bracket

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Pull latest ratings
        run: python update.py
        env:
          KENPOM_EMAIL: ${{ secrets.KENPOM_EMAIL }}
          KENPOM_PASSWORD: ${{ secrets.KENPOM_PASSWORD }}
      - name: Save data.json
        run: |
          git config user.name "bracket-bot"
          git config user.email "bracket-bot@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh data $(date -u +%F)"
            git push
          fi
      - name: Build site folder
        run: mkdir site && cp index.html data.json site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
